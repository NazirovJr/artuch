name: Android APK

# Builds the Android app: prebuilds the native project from app.json
# (Expo Continuous Native Generation), then runs Gradle to produce an APK.
# Output lands in the run's Artifacts. Auto-runs on push to master.

on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: "Backend API base URL baked into the build (no trailing /api)"
        required: true
        default: "https://artuch.org"
      buildType:
        description: "Build type (release = standalone APK, runs without Metro)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
    paths:
      - "staff-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # API URL baked into the JS bundle. Manual run overrides; auto runs
      # use the artuch.org default.
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.apiUrl || 'https://artuch.org' }}
      # release = JS bundle baked into the APK → runs standalone on any
      # device (no Metro). debug expects a reachable Metro dev server.
      BUILD_TYPE: ${{ github.event.inputs.buildType || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reclaim ~20 GB the runner pre-loads with toolchains we don't use
      # (.NET, Haskell, Swift, CodeQL). Reanimated/worklets compile native
      # C++ and can otherwise exhaust the runner's ~14 GB free disk. Only
      # removes clearly-unrelated dirs — never the Android SDK/NDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Android Gradle Plugin 8.x requires JDK 17 — Java 21+ trips it.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install staff-app deps
        working-directory: staff-app
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (generate android/)
        working-directory: staff-app
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Make gradlew executable
        working-directory: staff-app/android
        run: chmod +x ./gradlew

      # release APK bakes index.android.bundle into the package → installs
      # and runs standalone on any device ("Install from unknown sources"),
      # NO Metro server needed. Expo's template signs release with the debug
      # keystore by default, so it's installable as-is (not Play-Store
      # uploadable — that needs a real keystore in repo secrets, a follow-up).
      # debug APK, by contrast, expects a reachable Metro dev server.
      #
      # Build ONLY arm64-v8a: every real Android phone/tablet since ~2017 is
      # arm64. Skipping x86/x86_64 (emulator-only) + armeabi-v7a cuts the
      # native C++ build ~4× (39 min → ~12 min) and sidesteps the
      # reanimated x86 .so AAR-packaging failure. To support ancient 32-bit
      # devices, add armeabi-v7a to the comma list below.
      - name: Build APK
        working-directory: staff-app/android
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          else
            ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtuchStaff-Android-${{ env.BUILD_TYPE }}
          path: staff-app/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
