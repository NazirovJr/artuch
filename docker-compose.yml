# Secrets are read from a local `.env` file (NOT committed). Copy
# `.env.example` → `.env` and fill in real values before `docker compose up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: artuch-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artuch}
      POSTGRES_USER: ${POSTGRES_USER:-artuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artuch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: artuch-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-artuch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-artuch}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env (openssl rand -hex 32)}
      NODE_ENV: ${NODE_ENV:-production}
      # SMTP (optional) — set these to enable real guest emails
      # (reservation confirmations, folio receipts). Unset = logged stubs.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly pg_dump into ./backups (compressed, keeps last BACKUP_KEEP days).
  # Restore: scripts/restore-db.sh backups/artuch-YYYY-MM-DD.sql.gz
  db-backup:
    image: postgres:16-alpine
    container_name: artuch-db-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-artuch}
      POSTGRES_DB: ${POSTGRES_DB:-artuch}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command: >
      -c 'while true; do
            ts=$$(date +%F);
            pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB
              | gzip > "/backups/artuch-$$ts.sql.gz"
              && echo "[backup] artuch-$$ts.sql.gz OK";
            ls -1t /backups/artuch-*.sql.gz 2>/dev/null
              | tail -n +$$((BACKUP_KEEP+1)) | xargs -r rm --;
            sleep 86400;
          done'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
