services:
  postgres:
    image: postgres:16-alpine
    container_name: artuch-db
    environment:
      POSTGRES_DB: artuch
      POSTGRES_USER: artuch
      POSTGRES_PASSWORD: artuch_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artuch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: artuch-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://artuch:artuch_dev_2026@postgres:5432/artuch
      JWT_SECRET: dev_jwt_secret_artuch_2026
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  mobile-app:
    image: artuch-mobile
    build:
      context: "./Mobile App for Artuch Travel"
      dockerfile: ../Dockerfile
    container_name: artuch-mobile
    ports:
      - "5173:5173"
    volumes:
      - "./Mobile App for Artuch Travel/src:/app/src"
    command: npx vite --host 0.0.0.0 --port 5173
    depends_on:
      - backend

  shop-bar:
    image: artuch-shop-bar
    build:
      context: "./Магазин и бар для туристов"
      dockerfile: ../Dockerfile
    container_name: artuch-shop-bar
    ports:
      - "5174:5174"
    volumes:
      - "./Магазин и бар для туристов/src:/app/src"
    command: npx vite --host 0.0.0.0 --port 5174
    depends_on:
      - backend

  food-ordering:
    image: artuch-food
    build:
      context: "./Система заказа блюд"
      dockerfile: ../Dockerfile
    container_name: artuch-food
    ports:
      - "5175:5175"
    volumes:
      - "./Система заказа блюд/src:/app/src"
    command: npx vite --host 0.0.0.0 --port 5175
    depends_on:
      - backend

volumes:
  pgdata:
