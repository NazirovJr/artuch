# Secrets are read from a local `.env` file (NOT committed). Copy
# `.env.example` → `.env` and fill in real values before `docker compose up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: artuch-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artuch}
      POSTGRES_USER: ${POSTGRES_USER:-artuch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artuch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: artuch-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-artuch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-artuch}
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env (openssl rand -hex 32)}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
